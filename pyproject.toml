[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pcghe-ecg"
version = "0.1.0"
description = "Patient-independent plaintext ECG baseline for later CKKS inference"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "joblib>=1.4",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "PyWavelets>=1.7",
  "requests>=2.32",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "wfdb>=4.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
pcghe-ecg = "pcghe_ecg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
